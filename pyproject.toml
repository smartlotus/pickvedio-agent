[build-system]
# setuptools>=77 for PEP 639 ( SPDX string license ), which is what the
# `license = "MIT"` below relies on.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pickvedio-core"
version = "1.0.19"
description = "Turn a long video URL into a timestamped transcript and a layered Chinese summary. Headless core + JSON CLI + HTTP service, built to be deployed by an agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "smartlotus" }]
keywords = ["video", "transcript", "summary", "bilibili", "youtube", "whisper", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# The transcript ladder degrades gracefully: with only the base install the
# relayed-transcript and summariser paths still work; these extras add the
# channels that need heavier third-party code.
media = ["yt-dlp>=2025.1.0"]
service = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
local-asr = ["faster-whisper>=1.1.0", "numpy>=1.24"]
all = [
    "yt-dlp>=2025.1.0",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "yt-dlp>=2025.1.0",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    # Tests that read the Muse skill pack need a real YAML loader (the eval
    # scenarios use anchors, so regex parsing would not resolve them). This was
    # invisible locally because Anaconda ships PyYAML; CI's Test job failed on
    # `No module named 'yaml'` -- see docs/verification.md 5t.
    "PyYAML>=6",
]

[project.scripts]
pvc = "pvc.cli:main"

[project.urls]
Homepage = "https://github.com/smartlotus/pickvedio-agent"
Repository = "https://github.com/smartlotus/pickvedio-agent"
Issues = "https://github.com/smartlotus/pickvedio-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

# The prompt templates ship inside prompts.py; an editable override directory
# lives at the repo root (see prompts/README.md), not inside the wheel.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "UP", "SIM"]
ignore = ["E501", "SIM108"]


[tool.ruff.lint.per-file-ignores]
# `Body(...)` in a signature is how FastAPI declares a request body; there is no
# equivalent form that keeps the OpenAPI schema correct.
"src/service/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
