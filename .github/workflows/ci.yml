name: CI

# Everything here is a gate on the repository as shipped: the library, the CLI,
# the FastAPI service, the Muse skill pack and the container image. Nothing in
# this workflow pushes anything anywhere (see .github/workflows/docker.yml and
# release.yml for publishing).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: No working or output directories are tracked
        # An accidental `git add -A` once published a SQLite job database and
        # generated reports whose write-ahead log contained this machine's
        # absolute path. Cheap check, permanent gate.
        run: |
          bad=$(git ls-files | grep -E '(^|/)[A-Za-z0-9_-]*-work/|\.sqlite3-(shm|wal|journal)$' || true)
          if [ -n "$bad" ]; then
            echo "these must never be tracked:"; echo "$bad"; exit 1
          fi
          echo "no job state, media or database sidecar files tracked"
      - name: Install project with dev extras
        # Editable install so the `pvc` console script exists on PATH for the
        # later steps of every job.
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        # Formatting is advisory until the codebase settles; keep it visible but
        # do not let a reformat block a deploy-critical fix.
        continue-on-error: true
        run: ruff format --check .

      - name: Import the ASGI app object the deploy targets
        # The Dockerfile, railway.json, render.yaml and fly.toml all name
        # `service.app:app`. Fail early if that import path drifts.
        # cd /tmp first: from the repo root a bare `import service.app` also
        # succeeds when the package is NOT installed (the directory is right
        # there), which is exactly how the last release shipped a broken
        # entrypoint claim.
        run: |
          cd "$(mktemp -d)"
          python -c "import service.app; print('service.app:app importable from site-packages')"
          python -m pvc.cli --help >/dev/null

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with dev extras
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'

      - name: pvc --help exits 0
        # Console-script smoke test: `pvc` must be on PATH and its entry point
        # must import cleanly. Actions runs `bash -e`, so a non-zero exit fails
        # the step; the file is dumped anyway so a traceback is visible.
        run: |
          pvc --help
          echo "pvc --help OK"

      - name: pvc check (offline self-test)
        # `pvc check` is documented as a network-free run against the bundled
        # fixture, so it needs no API key. If this step starts failing because
        # something tried to reach the network, that is a bug in `check` -- do
        # not paper over it with a dummy PVC_LLM_API_KEY.
        run: pvc check

      - name: pvc status is machine-readable
        run: pvc status | python -c "import json,sys; d=json.load(sys.stdin); assert set(['ok','code','message','data']) <= set(d), d; print('envelope ok')"

      - name: pytest
        run: pytest -q

  bootstrap:
    name: Bootstrap (agent VM path)
    # The recommended deployment is an agent running this repo inside its own
    # VM. That route is only real if a clean checkout plus `bash bootstrap.sh`
    # produces a working CLI, so CI runs exactly those two steps.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run bootstrap.sh from a fresh clone
        # The console log is written outside the checkout on purpose: it contains
        # this runner's absolute paths, and the step below asserts that a real
        # bootstrap leaves no untracked file in the tree.
        run: |
          LOG="${RUNNER_TEMP:-/tmp}/bootstrap.log"
          bash bootstrap.sh | tee "$LOG"
          grep -q "verdict: READY" "$LOG"
          test -x .venv/bin/pvc
          .venv/bin/pvc profiles | python3 -c "
          import json,sys
          d = json.load(sys.stdin)
          assert d['ok'] and any(p['profile'] == 'brief' for p in d['data']['profiles'])
          print('bootstrap CLI OK')
          "
      - name: Keep the bootstrap reports out of git
        # They hold this runner's paths. Assert git ignores them -- do NOT
        # `git add -f` to look for them, which would stage exactly the files
        # this step is supposed to catch.
        run: |
          for f in .bootstrap-check.json .bootstrap-status.json; do
            touch "$f"
            git check-ignore -q "$f" || { echo "$f must be in .gitignore"; exit 1; }
          done
          left=$(git status --porcelain | grep -E '^\?\? ' || true)
          if [ -n "$left" ]; then
            echo "::error::bootstrap wrote something nobody declared as ignored"
            echo "$left"
            exit 1
          fi
          echo "checkout still clean after a real bootstrap run"

      - name: Bootstrap on a Debian-style VM without python3-venv
        # The Muse/agent VM is a distro image, and Ubuntu/Debian ship python3
        # with ensurepip in a separate package, so `python3 -m venv` fails at the
        # very first step of the recommended route with a message that looks like
        # a bug in this repo. bootstrap.sh falls back to --without-pip +
        # get-pip.py; this job is the only place that fallback is real-tested.
        # The fixture asserts its own brokenness first: if ensurepip imports, the
        # container is not the failing case and the run proves nothing.
        run: |
          docker run --rm -v "$PWD:/repo" ubuntu:24.04 bash -euo pipefail -c '
            apt-get update -qq > /dev/null
            apt-get install -y -qq --no-install-recommends python3 curl ca-certificates tar > /dev/null
            python3 -V
            if python3 -c "import ensurepip" 2>/dev/null; then
              echo "::error::fixture is not the broken case (ensurepip importable)"
              exit 1
            fi
            echo "fixture confirmed: python3 present, ensurepip missing"
            mkdir -p /work && tar -C /repo --exclude=.git --exclude=.venv -cf - . | tar -C /work -xf -
            cd /work
            bash bootstrap.sh 2>&1 | tail -n 20
            test -x /work/.venv/bin/pvc
            /work/.venv/bin/pvc check > /dev/null && echo "debian-style bootstrap OK"
          '
  install:
    name: Install (documented route)
    # The agent-VM route starts with one pip command copied out of these docs.
    # `pickvedio-core` is deliberately NOT published to PyPI, so a bare-name
    # instruction is not a typo -- it is a dead end for whoever pastes it, and
    # the failure looks like a bug in this tool. Two checks, both load-bearing:
    # no command line may install the bare name, and the command that the docs
    # do give has to work in a clean venv, outside the checkout.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive the documented install route from pyproject.toml
        # The version is written down exactly once more, here. Reading it from
        # the package metadata instead of hard-coding it in CI means a release
        # bump cannot leave this job approving an outdated pin.
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(encoding='utf-8'), re.M).group(1))")
          echo "PVC_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PVC_INSTALL_SPEC=pickvedio-core @ git+https://github.com/smartlotus/pickvedio-agent@v$VERSION" >> "$GITHUB_ENV"
          echo "PVC_WHEEL_URL=https://github.com/smartlotus/pickvedio-agent/releases/download/v$VERSION/pickvedio_core-$VERSION-py3-none-any.whl" >> "$GITHUB_ENV"
          echo "install spec under test: $VERSION"

      - name: Every documented pin is this version
        run: |
          python - <<PY
          import re, sys
          from pathlib import Path

          version = "$VERSION".strip('"')
          files = [Path("README.md"), Path("AGENTS.md"), *Path(".").glob("docs/*.md"),
                   *Path(".").glob("deploy/*.md"), *Path(".").glob("skills/**/*.md")]
          stale = []
          for path in files:
              if not path.is_file() or path.name == "verification.md":
                  continue  # an evidence log: older tags quoted there are history
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), start=1):
                  for found in re.findall(r"pickvedio-agent@v(\d+\.\d+\.\d+)", line):
                      if found != version:
                          stale.append(f"{path}:{number}: git pin @v{found}")
                  for found in re.findall(r"download/v(\d+\.\d+\.\d+)/", line):
                      if found != version:
                          stale.append(f"{path}:{number}: release pin download/v{found}")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              print("::error::could not read a version out of pyproject.toml")
              sys.exit(1)
          if stale:
              print("::error::install instructions point at another release")
              for item in stale:
                  print("  ", item)
              sys.exit(1)
          print(f"every documented install pin is v{version} (verification.md exempt as history)")
          PY

      - name: No documented command installs the unpublished PyPI name
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          ROOT = Path(".")
          SHIPPED = [
              Path("README.md"), Path("AGENTS.md"),
              *ROOT.glob("docs/*.md"),
              *ROOT.glob("deploy/*.md"),
              *ROOT.glob("skills/**/*.md"),
          ]
          # A line that *is* a shell command: optional prompt/`python -m`, then
          # `pip install`. Comments (`# ...`) and prose mentions are allowed to
          # name the bare package, because that is how we warn about it.
          COMMAND = re.compile(r"^(?:\$ )?(?:python3(?:\.\d+)? -m )?pip install\b")
          RESOLVES = (
              "git+https://github.com/smartlotus/pickvedio-agent",
              "releases/download/v",  # the wheel/sdist attached to the tag
              "-e ",
              ".[",
          )

          offenders = []
          for path in SHIPPED:
              if not path.is_file():
                  continue
              text = path.read_text(encoding="utf-8")
              for number, line in enumerate(text.splitlines(), start=1):
                  stripped = line.strip().removeprefix("$ ")
                  if not COMMAND.match(stripped):
                      continue
                  if "pickvedio-core" not in stripped:
                      continue
                  if any(hint in stripped for hint in RESOLVES):
                      continue
                  offenders.append(f"{path}:{number}: {stripped}")

          # The gate is only worth having if it can go red. Feed the forbidden
          # shape through the same classifier and require exactly one hit.
          probe = 'python3 -m pip install "pickvedio-core[service]"'
          probe_hit = bool(COMMAND.match(probe.removeprefix("$ "))) and "pickvedio-core" in probe
          probe_hit = probe_hit and not any(h in probe for h in RESOLVES)
          if not probe_hit:
              print("::error::the bare-name classifier no longer catches its own probe")
              sys.exit(1)
          print(f"negative control OK: {probe!r} is caught")

          if offenders:
              print("::error::install instructions that cannot resolve:")
              for item in offenders:
                  print("  ", item)
              sys.exit(1)
          print(f"{len(SHIPPED)} shipped docs checked, every pip command resolves")
          PY

      - name: Run the documented install in a clean venv
        run: |
          # `.venv-*` so .gitignore's `.venv*/` covers it: an env created inside
          # a checkout must never be able to reach a commit.
          python -m venv .venv-install
          .venv-install/bin/python -m pip install --quiet --disable-pip-version-check \
            "$PVC_INSTALL_SPEC"
          .venv-install/bin/pvc --help > /dev/null
          .venv-install/bin/pvc check | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['ok'], d
          assert d['data']['network_used'] is False, d['data']
          print('installed CLI works off-checkout:', d['code'])
          "

      - name: The install spec is the one the README gives
        # Docs and CI may not drift: the string above must appear verbatim in
        # the quick start, otherwise this job proves nothing about what a reader
        # will actually copy.
        run: |
          grep -qF "$PVC_INSTALL_SPEC" README.md || {
            echo "::error::README quick start no longer carries this exact requirement line"; exit 1; }
          echo "README and CI agree on the install route"

  skill:
    name: Skill pack (Muse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyYAML is a CI-only tool here, not a runtime dependency of the package.
      - name: Install yaml parser
        run: python -m pip install --upgrade pip && pip install pyyaml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate SKILL.md frontmatter and manifest.yaml
        run: |
          python - <<'PY'
          import sys
          import yaml
          from pathlib import Path

          skill_dir = Path("skills/video-summary")
          failures = []

          # --- SKILL.md: --- frontmatter with the exact Muse keys ---
          skill_md = skill_dir / "SKILL.md"
          if not skill_md.is_file():
              failures.append(f"{skill_md} is missing")
          else:
              text = skill_md.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  failures.append("SKILL.md must start with a '---' frontmatter fence")
              else:
                  parts = text.split("---\n")
                  # parts[0] == "" before the opening fence
                  if len(parts) < 3:
                      failures.append("SKILL.md frontmatter has no closing '---' fence")
                  else:
                      raw = parts[1]
                      try:
                          fm = yaml.safe_load(raw)
                      except yaml.YAMLError as exc:
                          failures.append(f"SKILL.md frontmatter is not parseable YAML: {exc}")
                          fm = None
                      if fm is not None:
                          if not isinstance(fm, dict):
                              failures.append("SKILL.md frontmatter must be a mapping")
                          else:
                              required = ["name", "description", "icon", "metadata"]
                              for key in required:
                                  if key not in fm:
                                      failures.append(f"SKILL.md frontmatter missing key: {key}")
                              for key in required:
                                  if key in fm and fm[key] in (None, ""):
                                      failures.append(f"SKILL.md frontmatter key empty: {key}")
                              if "name" in fm and fm["name"] != skill_dir.name:
                                  failures.append(
                                      f"SKILL.md name {fm['name']!r} != directory {skill_dir.name!r}"
                                  )
                              if "metadata" in fm and not isinstance(fm["metadata"], dict):
                                  failures.append("SKILL.md metadata must be a mapping")

          # --- manifest.yaml: parses and carries the required connector keys ---
          manifest = skill_dir / "manifest.yaml"
          if not manifest.is_file():
              failures.append(f"{manifest} is missing")
          else:
              try:
                  data = yaml.safe_load(manifest.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  failures.append(f"manifest.yaml is not parseable YAML: {exc}")
                  data = None
              if data is not None:
                  if not isinstance(data, dict):
                      failures.append("manifest.yaml must be a mapping")
                  else:
                      required = [
                          "version",
                          "connector",
                          "display_name",
                          "description",
                          "actions",
                          "cli_subcommands",
                          "consent_screen",
                      ]
                      for key in required:
                          if key not in data:
                              failures.append(f"manifest.yaml missing key: {key}")
                      actions = data.get("actions")
                      if isinstance(actions, dict):
                          for tier in ("read", "write"):
                              if tier not in actions:
                                  failures.append(f"manifest.yaml actions missing tier: {tier}")
                              else:
                                  if "default" not in actions[tier]:
                                      failures.append(
                                          f"manifest.yaml actions.{tier}.default missing"
                                      )
                                  if "methods" not in actions[tier]:
                                      failures.append(
                                          f"manifest.yaml actions.{tier}.methods missing"
                                      )

          # --- eval scenarios parse too (they are YAML deliverables) ---
          for extra in sorted(skill_dir.glob("eval/*.yaml")) + sorted(
              skill_dir.glob("references/*.md")
          ):
              if extra.suffix != ".yaml":
                  continue
              try:
                  yaml.safe_load(extra.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  failures.append(f"{extra} is not parseable YAML: {exc}")

          if failures:
              print("::error::skill pack validation failed")
              for line in failures:
                  print(" -", line)
              sys.exit(1)
          print("skill pack OK")
          PY

      - name: node --check browser-extract.js
        # The relay tier is evaluated inside a browser page; a syntax error there
        # is the single most expensive failure mode in this repo, because it
        # silently breaks the only transcript path that works from a datacenter IP.
        run: node --check skills/video-summary/assets/browser-extract.js

      - name: references exist and are linked from SKILL.md
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          skill = Path("skills/video-summary")
          text = (skill / "SKILL.md").read_text(encoding="utf-8")
          missing = [
              rel
              for rel in (
                  "references/browser-extract.md",
                  "references/deploy-runbook.md",
                  "references/troubleshooting.md",
                  "assets/browser-extract.js",
              )
              if not (skill / rel).is_file()
          ]
          unlinked = [
              rel for rel in ("references/deploy-runbook.md", "references/browser-extract.md")
              if rel not in text
          ]
          if missing or unlinked:
              print("::error::skill pack references broken")
              for item in missing + unlinked:
                  print(" -", item)
              sys.exit(1)
          print("references OK")
          PY

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the default relay-path image
        # No push here. Same command the README documents:
        #   docker build -t pickvedio-core .
        run: docker build -t pickvedio-core:ci .

      - name: Validate the compose file
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Start the image and hit /healthz
        # Proves the ENTRYPOINT/PORT/uvicorn contract and that /healthz needs no
        # token. PVC_API_TOKEN is a throwaway CI value, not a secret.
        run: |
          docker run -d --name pvc-ci -p 8080:8080 \
            -e PORT=8080 \
            -e PVC_API_TOKEN=ci-only-token \
            -e PVC_LLM_PROVIDER=deepseek \
            -e PVC_WORKDIR=/tmp/pvc-work \
            pickvedio-core:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              echo
              break
            fi
            if [ "$i" = "30" ]; then
              docker logs pvc-ci
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/openapi.json > /dev/null && echo "openapi ok"

      - name: /v1 requires the bearer token
        # An unauthenticated /v1 call must NOT succeed: it is the difference
        # between a personal service and a free summariser for the whole internet.
        run: |
          if curl -sS -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:8080/v1/jobs \
              -H 'content-type: application/json' \
              -d '{"url":"https://www.bilibili.com/video/BV1rjKn6CETw/"}' | grep -q '^2'; then
            echo "::error::/v1/jobs answered without a token"
            exit 1
          fi
          echo "auth gate ok"

      - name: pvc --help inside the image
        run: docker run --rm --entrypoint pvc pickvedio-core:ci --help

      - name: Build the optional ffmpeg image variant
        # The ASR path is opt-in and heavy; keep the build green but do not
        # smoke-test transcription here (that would need network + money).
        timeout-minutes: 20
        run: docker build -t pickvedio-core:ci-ffmpeg --build-arg INCLUDE_FFMPEG=1 .

      - name: ffmpeg exists only in the variant
        run: |
          docker run --rm --entrypoint sh pickvedio-core:ci -c \
            'command -v ffmpeg >/dev/null 2>&1 && echo "unexpected ffmpeg" && exit 1 || echo "default image has no ffmpeg (correct)"'
          docker run --rm --entrypoint sh pickvedio-core:ci-ffmpeg -c \
            'command -v ffmpeg >/dev/null && ffmpeg -version | head -n 1'

      - name: Runs as non-root
        run: |
          user=$(docker run --rm --entrypoint id pickvedio-core:ci -u)
          echo "container uid=$user"
          [ "$user" != "0" ]
