name: Release

# Triggered by a version tag (`git tag v1.0.0 && git push --tag`):
#   1. builds an sdist + wheel,
#   2. attaches them to a GitHub Release, together with a zip of the Muse skill
#      pack so a non-Python user can install the skill without touching pip,
#   3. publishes the distribution to PyPI -- only if the repository variable
#      PYPI_PUBLISH is `true` (see the pypi job). A tag with that variable unset
#      produces a GitHub Release and nothing else, which is the shipped state:
#      every documented install path uses this repository's git URL, not PyPI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.0.0
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tag name, however this run was started: a `v*` push carries it in
  # github.ref_name, a manual run carries it in the `tag` input. Every job below
  # uses this instead of GITHUB_REF_NAME, because on a workflow_dispatch run
  # GITHUB_REF_NAME is the *branch* (main) -- which once would have created a
  # GitHub Release named "main" pointing at branch head.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build sdist, wheel and skill pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          # workflow_dispatch on an older tag needs the tag itself, not just the
          # default branch.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build distribution (sdist + wheel)
        # `python -m build` writes dist/*.tar.gz and dist/*.whl from the
        # setuptools backend declared in pyproject.toml.
        run: python -m build --outdir dist

      - name: Verify the artifacts
        run: |
          python -m pip install --force-reinstall dist/*.whl
          pvc --help > /dev/null
          pvc check
          python -m pip install --force-reinstall dist/*.tar.gz
          pvc --help > /dev/null
          echo "artifact contents:"
          tar -tzf dist/*.tar.gz | sed -n '1,40p'

      - name: Package the Muse skill pack as a zip asset
        # A non-Python user cannot `pip install` a skill; they unzip it into
        # /opt/hatch/skills/. The zip keeps the directory as its top level, so
        # `unzip video-summary-skill-<tag>.zip` yields video-summary/SKILL.md.
        run: |
          test -f skills/video-summary/SKILL.md
          test -f skills/video-summary/manifest.yaml
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import os
          import pathlib
          import zipfile
          import yaml

          skill = pathlib.Path("skills/video-summary")
          version = (os.environ.get("RELEASE_TAG") or "dev").lstrip("v") or "dev"
          out = pathlib.Path("dist") / f"video-summary-skill-{version}.zip"
          out.parent.mkdir(parents=True, exist_ok=True)

          # Fail loudly rather than shipping a broken skill.
          for name in ("SKILL.md", "manifest.yaml"):
              data = yaml.safe_load((skill / name).read_text(encoding="utf-8").split("---\n")[1]
                                    if name == "SKILL.md"
                                    else (skill / name).read_text(encoding="utf-8"))
              assert isinstance(data, dict), f"{name} is not a mapping"

          skipped = ("__pycache__", ".pytest_cache", ".DS_Store")
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(skill.rglob("*")):
                  if not path.is_file() or any(part in skipped for part in path.parts):
                      continue
                  # relative to skills/ so the zip always has exactly one top
                  # level directory: video-summary/SKILL.md, .../assets/..., no
                  # matter what cwd or absolute root this runs from.
                  zf.write(path, path.relative_to(skill.parent).as_posix())
          print("wrote", out)
          PY
          unzip -l "dist/video-summary-skill-${RELEASE_TAG#v}.zip"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Needed only to create the release and upload its assets. The default
      # `contents: read` from the workflow level is restored for every other job.
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist

      - name: Create the release and attach every artifact
        # This job has no checkout on purpose (it only needs the artifacts), so
        # every `gh` call must name the repository: without `-R` gh shells out
        # to git to discover it and dies with "failed to run git: fatal: not a
        # git repository". That is how the first real tag push failed.
        # `--target` is the tag, not GITHUB_SHA: on a workflow_dispatch run the
        # SHA is branch head, which would hang the release off the wrong commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" \
              -R "$GITHUB_REPOSITORY" \
              --target "$TAG" \
              --title "pickvedio-core $TAG" \
              --generate-notes
          fi
          # Release assets: the Python distribution AND the skill zip.
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          # Assert the release is what a reader will find, not just that the
          # upload command returned 0.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets \
            --jq '{tag:.tagName, target:.targetCommitish, assets:[.assets[].name]}'

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # TWO things must be true before this job can pass, and neither is a code
    # change, so the default state is "skipped", not "failing":
    #   1. set the repository variable PYPI_PUBLISH to `true`
    #        gh variable set PYPI_PUBLISH --body true
    #      (or Settings -> Secrets and variables -> Actions -> Variables).
    #      Until you do, `v*` tags build and publish a GitHub Release only. That
    #      is deliberate: this project's docs install from the git URL, so a
    #      public repo works end to end without a PyPI account being wired up.
    #   2. PyPI -> your project "pickvedio-core" -> Publishing -> Trusted publishing:
    #        Repository name: pickvedio-agent     (owner: smartlotus)
    #        Workflow name:     release.yml       (this file)
    #        Environment:       pypi              (must match `environment` below)
    #        Distribution:      wheel AND sdist   (add both, or only one kind uploads)
    #      Also create the matching GitHub environment named `pypi` in
    #      Settings -> Environments, and leave its deployment protection rules
    #      empty unless you want manual approval before every publish.
    #   There is deliberately NO API token in repository secrets: a leaked
    #   secret is permanent, a short-lived OIDC id-token is not. Publishing with
    #   a token would also mean the key sits in a repo anyone can read events of.
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC id token for PyPI trusted publishing; nothing else
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Default upload directory; skip already-existing files so a
          # re-run of a failed release cannot half-publish a version.
          skip-existing: true
          verbose: true
