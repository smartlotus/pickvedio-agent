name: Release

# Triggered by a version tag (`git tag v1.0.0 && git push --tag`):
#   1. builds an sdist + wheel,
#   2. attaches them to a GitHub Release, together with a zip of the Muse skill
#      pack so a non-Python user can install the skill without touching pip,
#   3. publishes the distribution to PyPI -- only if the repository variable
#      PYPI_PUBLISH is `true` (see the pypi job). A tag with that variable unset
#      produces a GitHub Release and nothing else, which is the shipped state:
#      every documented install path uses this repository's git URL, not PyPI.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v1.0.0
        required: true
        default: ""

# The scopes this file's jobs need. A job may only *narrow* what the workflow
# level grants, so the widest scope any job needs is listed here and each job
# asks for its own subset:
#   contents: write -> only the GitHub Release job (create + upload assets)
#   id-token:  write -> only the PyPI job (OIDC trusted publishing)
# No secrets are read here at all; there is deliberately no API token.
#
# Measured history of the 403, because the shape of the rule matters here:
#   - tag push of v1.0.0 with `contents: read` at this level and write only in
#     the job -> HTTP 403 "Resource not accessible by integration" (jobs cannot
#     exceed the workflow level, which is why the level above grants the max).
#   - workflow_dispatch of that same tag with write granted at BOTH levels ->
#     still 403, on POST /releases.
#   - tag push of v1.0.1 with this exact file -> the release job succeeded and
#     published all three assets by itself.
# So the two 403s differ from the success by the workflow level (first case) and
# by the event (second case). I did not establish why a manual run was refused
# while a tag push is allowed, and I am not going to assert a cause I have not
# measured; the failure path below prints both remedies rather than guessing one.
# Publishing from your own account is a legitimate fallback, not a workaround:
#   gh release create <tag> --target <commit> --generate-notes && gh release upload <tag> dist/* --clobber
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tag name, however this run was started: a `v*` push carries it in
  # github.ref_name, a manual run carries it in the `tag` input. Every job below
  # uses this instead of GITHUB_REF_NAME, because on a workflow_dispatch run
  # GITHUB_REF_NAME is the *branch* (main) -- which once would have created a
  # GitHub Release named "main" pointing at branch head.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build sdist, wheel and skill pack
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout + build only; cannot write anything back
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          # workflow_dispatch on an older tag needs the tag itself, not just the
          # default branch.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build distribution (sdist + wheel)
        # `python -m build` writes dist/*.tar.gz and dist/*.whl from the
        # setuptools backend declared in pyproject.toml.
        run: python -m build --outdir dist

      - name: Verify the artifacts
        run: |
          python -m pip install --force-reinstall dist/*.whl
          pvc --help > /dev/null
          pvc check
          python -m pip install --force-reinstall dist/*.tar.gz
          pvc --help > /dev/null
          echo "artifact contents:"
          tar -tzf dist/*.tar.gz | sed -n '1,40p'

      - name: Package the Muse skill pack as a zip asset
        # A non-Python user cannot `pip install` a skill; they unzip it into
        # /opt/hatch/skills/. The zip keeps the directory as its top level, so
        # `unzip video-summary-skill-<tag>.zip` yields video-summary/SKILL.md.
        run: |
          test -f skills/video-summary/SKILL.md
          test -f skills/video-summary/manifest.yaml
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import os
          import pathlib
          import zipfile
          import yaml

          skill = pathlib.Path("skills/video-summary")
          version = (os.environ.get("RELEASE_TAG") or "dev").lstrip("v") or "dev"
          out = pathlib.Path("dist") / f"video-summary-skill-{version}.zip"
          out.parent.mkdir(parents=True, exist_ok=True)

          # Fail loudly rather than shipping a broken skill.
          for name in ("SKILL.md", "manifest.yaml"):
              data = yaml.safe_load((skill / name).read_text(encoding="utf-8").split("---\n")[1]
                                    if name == "SKILL.md"
                                    else (skill / name).read_text(encoding="utf-8"))
              assert isinstance(data, dict), f"{name} is not a mapping"

          skipped = ("__pycache__", ".pytest_cache", ".DS_Store")
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(skill.rglob("*")):
                  if not path.is_file() or any(part in skipped for part in path.parts):
                      continue
                  # relative to skills/ so the zip always has exactly one top
                  # level directory: video-summary/SKILL.md, .../assets/..., no
                  # matter what cwd or absolute root this runs from.
                  zf.write(path, path.relative_to(skill.parent).as_posix())
          print("wrote", out)
          PY
          unzip -l "dist/video-summary-skill-${RELEASE_TAG#v}.zip"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The only job that writes: create the release, upload its assets. It gets
      # no OIDC token, so it cannot reach PyPI even in principle.
      contents: write
      id-token: none
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist

      - name: Create the release and attach every artifact
        # This job has no checkout on purpose (it only needs the artifacts), so
        # every `gh` call must name the repository: without `-R` gh shells out
        # to git to discover it and dies with "failed to run git: fatal: not a
        # git repository". That is how the first real tag push failed.
        # `--target` is the tag, not GITHUB_SHA: on a workflow_dispatch run the
        # SHA is branch head, which would hang the release off the wrong commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          # `target_commitish` takes a branch name or a commit SHA -- NOT a tag
          # name. `--target v1.0.0` is refused outright with
          # `HTTP 422: Release.target_commitish is invalid` (measured on the
          # first real release). Resolving through the API dereferences an
          # annotated tag and behaves identically on a tag push and a manual run.
          TARGET=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Measured, and deliberately not explained: the v1.0.1 tag push ran
            # this call successfully; the v1.0.2 tag push ran it with an
            # identical permissions block, identical event, and identical
            # effective file content (git diff between the two tag commits shows
            # only comments and echo text) and got HTTP 403. So the outcome is
            # not determined by anything in this repository, and a refusal is
            # treated as transient within a bounded number of tries -- not
            # retried forever, and never retried past the third attempt.
            created=""
            for attempt in 1 2 3; do
              if gh release create "$TAG" \
                -R "$GITHUB_REPOSITORY" \
                --target "$TARGET" \
                --title "pickvedio-core $TAG" \
                --generate-notes; then
                created="$attempt"
                break
              fi
              echo "release create refused on attempt $attempt of 3"
              [ "$attempt" = 3 ] || sleep 20
            done
            if [ -z "$created" ]; then
              echo "::error::the workflow token was refused write access to releases, three times"
              echo "Same file and same event succeeded for v1.0.1, so this is not a YAML bug"
              echo "and retrying further is unlikely to help. Two ways forward:"
              echo "  1. Settings -> Actions -> General -> Read and write permissions, or"
              echo "     gh api -X PUT repos/$GITHUB_REPOSITORY/actions/permissions/workflow \\"
              echo "        -f default_workflow_permissions=read-write -f can_approve_pull_request_reviews=false"
              echo "  2. publish this tag from an account token instead:"
              echo "     gh release create $TAG --target $TARGET --generate-notes"
              echo "     gh release upload $TAG dist/* --clobber"
              exit 1
            fi
            echo "release created on attempt $created"
          fi
          # Release assets: the Python distribution AND the skill zip.
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          # Assert the release is what a reader will find, not just that the
          # upload command returned 0.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets \
            --jq '{tag:.tagName, target:.targetCommitish, assets:[.assets[].name]}'

      - name: Set up Python for the install proof
        # The ubuntu runner's own python3 has no ensurepip (the Bootstrap job in
        # ci.yml proves that on purpose), so `python -m venv` needs a real
        # interpreter here rather than the image default.
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The wheel URL the README documents installs anonymously
        # Second documented route ("no git on this machine"), and until now the
        # one CI never executed: ci.yml exported PVC_WHEEL_URL and then ignored
        # it. This job is the only place the asset necessarily exists at that
        # exact URL -- it was uploaded three steps above -- and the install is
        # deliberately unauthenticated, because a phone-side agent has no token.
        run: |
          VERSION="${RELEASE_TAG#v}"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/pickvedio_core-$VERSION-py3-none-any.whl"
          echo "proof target: $URL"
          curl -fsSI -o /dev/null "$URL"
          python -m venv .venv-url
          .venv-url/bin/python -m pip install --quiet --disable-pip-version-check \
            "pickvedio-core[service] @ $URL"
          .venv-url/bin/pvc check | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d['ok'], d
          assert d['data']['network_used'] is False, d['data']
          print('documented wheel URL installed and self-tested:', d['code'])
          "

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    # TWO things must be true before this job can pass, and neither is a code
    # change, so the default state is "skipped", not "failing":
    #   1. set the repository variable PYPI_PUBLISH to `true`
    #        gh variable set PYPI_PUBLISH --body true
    #      (or Settings -> Secrets and variables -> Actions -> Variables).
    #      Until you do, `v*` tags build and publish a GitHub Release only. That
    #      is deliberate: this project's docs install from the git URL, so a
    #      public repo works end to end without a PyPI account being wired up.
    #   2. PyPI -> your project "pickvedio-core" -> Publishing -> Trusted publishing:
    #        Repository name: pickvedio-agent     (owner: smartlotus)
    #        Workflow name:     release.yml       (this file)
    #        Environment:       pypi              (must match `environment` below)
    #        Distribution:      wheel AND sdist   (add both, or only one kind uploads)
    #      Also create the matching GitHub environment named `pypi` in
    #      Settings -> Environments, and leave its deployment protection rules
    #      empty unless you want manual approval before every publish.
    #   There is deliberately NO API token in repository secrets: a leaked
    #   secret is permanent, a short-lived OIDC id-token is not. Publishing with
    #   a token would also mean the key sits in a repo anyone can read events of.
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC id token for PyPI trusted publishing; nothing else
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Default upload directory; skip already-existing files so a
          # re-run of a failed release cannot half-publish a version.
          skip-existing: true
          verbose: true
